<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARENA X — Match Admin Panel</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg-canvas: #0F172A;
      --card-surface: #1E293B;
      --card-border: #334155;
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --accent-gold: #FACC15;
      --gold-gradient: linear-gradient(135deg, #FACC15 0%, #FBBF24 100%);
      --accent-green: #10B981;
      --accent-red: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      padding-top: 75px;
      padding-bottom: 40px;
      min-height: 100vh;
    }

    .admin-navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(30, 41, 59, 0.98);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1040;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-tag {
      background: var(--gold-gradient);
      color: #0F172A;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .container-custom {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .admin-card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .form-control, .form-select {
      background: #0F172A;
      border: 1px solid var(--card-border);
      color: #fff;
    }

    .form-control:focus, .form-select:focus {
      background: #0F172A;
      border-color: var(--accent-gold);
      color: #fff;
      box-shadow: 0 0 0 0.2rem rgba(250, 204, 21, 0.25);
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #0F172A;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-gold:hover { filter: brightness(1.1); color: #0F172A; }

    .room-highlight-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed var(--accent-gold);
      border-radius: 10px;
      padding: 16px;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- Admin Navbar -->
  <header class="admin-navbar">
    <div class="brand-title">
      <i class="bi bi-shield-lock-fill text-warning"></i> ARENA X
      <span class="brand-tag">ADMIN</span>
    </div>
    <div>
      <a href="/" target="_blank" class="btn btn-sm btn-outline-warning">
        <i class="bi bi-box-arrow-up-right me-1"></i> Open User Panel
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container-custom">

    <div class="admin-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 fw-bold text-white mb-0">
          <i class="bi bi-controller text-warning me-1"></i> Match Setup & Room Control
        </h2>
        <span class="badge bg-warning text-dark fw-bold">REAL-TIME SYNC</span>
      </div>
      <p class="small text-secondary mb-4">Update match schedule, maps, and release Room ID & Password live to all players.</p>

      <form id="matchConfigForm" onsubmit="window.handleSaveMatchConfig(event)">
        
        <div class="mb-3">
          <label class="form-label small text-secondary">Match Title</label>
          <input type="text" class="form-control" id="admTitle" value="Free Fire Daily Squad Championship" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small text-secondary">Schedule Time</label>
            <input type="text" class="form-control" id="admTime" value="08:30 PM" placeholder="e.g. 08:30 PM" required>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">Match Status</label>
            <select class="form-select" id="admStatus">
              <option value="upcoming">Upcoming</option>
              <option value="live">Live Now</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small text-secondary">Total Matches (Series)</label>
            <select class="form-select" id="admMatchCount">
              <option value="1">1 Match</option>
              <option value="2">2 Matches</option>
              <option value="3" selected>3 Matches</option>
              <option value="4">4 Matches</option>
              <option value="5">5 Matches</option>
              <option value="6">6 Matches</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small text-secondary">Maps to Play</label>
            <input type="text" class="form-control" id="admMaps" value="Bermuda, Purgatory, Kalahari" placeholder="e.g. Bermuda, Purgatory" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label small text-secondary">Entry Fee (BDT ৳)</label>
            <input type="number" class="form-control" id="admEntryFee" value="100" required>
          </div>
          <div class="col-6">
            <label class="form-label small text-secondary">Prize Pool (BDT ৳)</label>
            <input type="number" class="form-control" id="admPrizePool" value="1000" required>
          </div>
        </div>

        <!-- Custom Room ID & Password -->
        <div class="room-highlight-box">
          <div class="fw-bold text-warning small mb-2">
            <i class="bi bi-key-fill me-1"></i> Custom Room Credentials (Instantly shows on user page)
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label small text-secondary">Room ID</label>
              <input type="text" class="form-control" id="admRoomId" placeholder="e.g. 893411">
            </div>
            <div class="col-6">
              <label class="form-label small text-secondary">Room Password</label>
              <input type="text" class="form-control" id="admRoomPass" placeholder="e.g. 7788">
            </div>
          </div>
        </div>

        <button type="submit" class="btn-gold" id="saveMatchBtn">
          <i class="bi bi-broadcast"></i> Save & Publish Live to Players
        </button>
      </form>
    </div>

  </main>

  <!-- FIREBASE FIRESTORE SYNC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBwoL8nXUevPWciB1cyjez5Bi_V9bYc98",
      authDomain: "ff-squad-arena-bd.firebaseapp.com",
      projectId: "ff-squad-arena-bd",
      storageBucket: "ff-squad-arena-bd.firebasestorage.app",
      messagingSenderId: "604500327184",
      appId: "1:604500327184:web:2eae6bfddea7ed2ae74395"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const TOURNAMENT_ID = "ff-daily-squad";

    let state = {
      title: "Free Fire Daily Squad Championship",
      status: "upcoming",
      time: "08:30 PM",
      matchCount: 3,
      maps: "Bermuda, Purgatory, Kalahari",
      entryFee: 100,
      prizePool: 1000,
      roomId: "893411",
      roomPass: "7788"
    };

    const $ = (id) => document.getElementById(id);

    // Sync Form Values
    function syncFormValues() {
      if ($('admTitle')) $('admTitle').value = state.title || '';
      if ($('admTime')) $('admTime').value = state.time || '08:30 PM';
      if ($('admStatus')) $('admStatus').value = state.status || 'upcoming';
      if ($('admMatchCount')) $('admMatchCount').value = state.matchCount || 3;
      if ($('admMaps')) $('admMaps').value = state.maps || 'Bermuda';
      if ($('admEntryFee')) $('admEntryFee').value = state.entryFee || 100;
      if ($('admPrizePool')) $('admPrizePool').value = state.prizePool || 1000;
      if ($('admRoomId')) $('admRoomId').value = state.roomId || '';
      if ($('admRoomPass')) $('admRoomPass').value = state.roomPass || '';
    }

    // Save Match Config
    window.handleSaveMatchConfig = async function(e) {
      e.preventDefault();
      const title = $('admTitle').value.trim();
      const time = $('admTime').value.trim();
      const status = $('admStatus').value;
      const matchCount = Number($('admMatchCount').value);
      const maps = $('admMaps').value.trim();
      const entryFee = Number($('admEntryFee').value);
      const prizePool = Number($('admPrizePool').value);
      const roomId = $('admRoomId').value.trim();
      const roomPass = $('admRoomPass').value.trim();

      const btn = $('saveMatchBtn');
      btn.disabled = true;
      btn.innerHTML = 'Saving...';

      try {
        const docRef = doc(db, "tournaments", TOURNAMENT_ID);
        await updateDoc(docRef, {
          title,
          time,
          status,
          matchCount,
          maps,
          entryFee,
          prizePool,
          roomId,
          roomPass
        });
        alert("Match details & Room ID published live to all users!");
      } catch (err) {
        console.error("Save error:", err);
        alert("Error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-broadcast"></i> Save & Publish Live to Players';
      }
      return false;
    };

    // Realtime Sync
    function startSync() {
      try {
        const docRef = doc(db, "tournaments", TOURNAMENT_ID);
        onSnapshot(docRef, (snap) => {
          if (snap.exists()) {
            state = { ...state, ...snap.data() };
            syncFormValues();
          } else {
            setDoc(docRef, state);
          }
        }, (err) => {
          console.warn("Firestore error:", err);
        });
      } catch (e) {
        console.warn("Firestore listener failed:", e);
      }
    }

    syncFormValues();
    startSync();
  </script>
</body>
</html>
