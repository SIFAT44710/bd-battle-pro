<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Esports Empire | SIFR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for Cinematic Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(34, 211, 238, 0.3); box-shadow: 0 0 30px rgba(34, 211, 238, 0.1); }
        .neon-text { text-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee; }
        .input-dark { background: rgba(0,0,0,0.5); border: 1px solid #334155; color: white; transition: all 0.3s; }
        .input-dark:focus { border-color: #22d3ee; box-shadow: 0 0 10px rgba(34, 211, 238, 0.3); outline: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div id="canvas-container"></div> <!-- 3D Sparks Container -->

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative z-10 m-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-cyan-400 neon-text tracking-wider mb-2">SIFR EMPIRE</h1>
            <p class="text-gray-400 text-sm">Launch your white-label esports platform</p>
        </div>

        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-xs text-cyan-300 uppercase tracking-wider mb-1">Your Name</label>
                <input type="text" id="name" required class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="Goku">
            </div>
            
            <div>
                <label class="block text-xs text-cyan-300 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" required class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="ceo@empire.com">
            </div>

            <div>
                <label class="block text-xs text-cyan-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required class="input-dark w-full px-4 py-3 rounded-lg text-sm" placeholder="••••••••">
            </div>

            <div>
                <label class="block text-xs text-cyan-300 uppercase tracking-wider mb-1">Desired Subdomain</label>
                <div class="flex items-center input-dark rounded-lg overflow-hidden pr-3">
                    <input type="text" id="subdomain" required class="w-full px-4 py-3 bg-transparent outline-none text-sm" placeholder="arena">
                    <span class="text-gray-500 text-sm font-medium">.sifr.com</span>
                </div>
                <p class="text-[10px] text-gray-500 mt-1">You can connect a custom domain later.</p>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 mt-4 bg-cyan-500 hover:bg-cyan-400 text-black font-bold uppercase tracking-wider rounded-lg transition-all shadow-[0_0_20px_rgba(34,211,238,0.5)]">
                Launch Platform
            </button>
            
            <p id="errorMsg" class="text-red-400 text-xs text-center hidden"></p>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">Already have an empire? <a href="/login.html" class="text-cyan-400 hover:underline">Sign In</a></p>
    </div>

    <!-- 3D Sparks Logic -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        // Custom texture for silver/cyan aura spark
        const material = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x22d3ee,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 3;

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX / window.innerWidth - 0.5;
            mouseY = e.clientY / window.innerHeight - 0.5;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.001;
            
            // Mouse parallax
            particlesMesh.position.x += (mouseX * 0.5 - particlesMesh.position.x) * 0.05;
            particlesMesh.position.y += (-mouseY * 0.5 - particlesMesh.position.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

    <script type="module">
        // Import our auth logic later
        // import { signUp } from './lib/auth.js';
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const sub = document.getElementById('subdomain').value;
            
            btn.textContent = "Processing...";
            btn.disabled = true;

            // Mocking signup logic for now
            setTimeout(() => {
                // Store sub name for the pending page message
                sessionStorage.setItem('pendingDomain', sub);
                window.location.href = '/pending.html';
            }, 1000);
        });
    </script>
</body>
</html>
