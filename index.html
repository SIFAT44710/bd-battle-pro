        }, 3200);
      }

      function copyText(text, successMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            () => showToast(successMsg || 'কপি করা হয়েছে!'),
            () => fallbackCopy(text, successMsg)
          );
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(successMsg || 'কপি করা হয়েছে!');
        } catch (e) {
          showToast('কপি করা যায়নি, ম্যানুয়ালি কপি করুন।', 'error');

        ta.remove();
      }

        return { activeMatches, totalSlots, bookedSquads, totalCollection, prizeOutflow, netBalance };

      // =========================================================================
      // RENDER & EVENT DELEGATION
      // =========================================================================
      function render() {
        const app = document.getElementById('app');
        if (!app) return;
        if (currentRoute === 'player') {
          app.innerHTML = renderPlayer();
        } else if (currentRoute === 'admin') {
          app.innerHTML = renderAdmin();
        } else if (currentRoute === 'login') {
          app.innerHTML = renderLogin();
        } else if (currentRoute === 'signup') {
          app.innerHTML = renderSignup();
        } else {
          app.innerHTML = renderLanding();
        }
        if (window.lucide) window.lucide.createIcons();
      }

      // Global Click Delegation
      document.addEventListener('click', (e) => {
        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
          navigate(navBtn.getAttribute('data-nav'));
          return;
        }

        const scrollBtn = e.target.closest('[data-scroll]');
        if (scrollBtn) {
          const targetId = scrollBtn.getAttribute('data-scroll');
          if (currentRoute !== 'landing') {
            navigate('landing', { scrollTo: targetId });
          } else {
            mobileMenuOpen = false;
            render();
            const el = document.getElementById(targetId);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }
          return;
        }

        if (e.target.closest('#mobile-menu-btn')) {
          mobileMenuOpen = !mobileMenuOpen;
          render();
          return;
        }

        const botTab = e.target.closest('[data-bot-tab]');
        if (botTab) {
          state.activeBotDemoTab = botTab.getAttribute('data-bot-tab');
          saveState();
          render();
          return;
        }

        const apkBtn = e.target.closest('[data-download-apk]');
        if (apkBtn) {
          const fmt = apkBtn.getAttribute('data-download-apk').toUpperCase();
          showToast(`SifrPay v2.2.1 (${fmt}) ডাউনলোড লিংক প্রস্তুত—লাইভ সার্ভারে সরাসরি ডাউনলোড হবে।`, 'info');
          return;
        }

        const planBtn = e.target.closest('[data-select-plan]');
        if (planBtn) {
          const plan = planBtn.getAttribute('data-select-plan');
          showToast(`${plan} প্যাকেজ সিলেক্ট করা হয়েছে—৩০ দিনের ফ্রি ট্রায়াল ফর্ম পূরণ করুন।`, 'success');
          navigate('signup');
          return;
        }

        const openPlayerMatch = e.target.closest('[data-open-player-match]');
        if (openPlayerMatch) {
          navigate('player', { matchId: Number(openPlayerMatch.getAttribute('data-open-player-match')) });
          return;
        }

        if (e.target.closest('#back-to-matches')) {
          playerDetailMatchId = null;
          render();
          return;
        }

        const copyBtn = e.target.closest('[data-copy]');
        if (copyBtn) {
          copyText(copyBtn.getAttribute('data-copy'), 'ক্লিপবোর্ডে কপি করা হয়েছে!');
          return;
        }

        const bookBtn = e.target.closest('[data-open-booking]');
        if (bookBtn) {
          showBookingModal(Number(bookBtn.getAttribute('data-open-booking')), bookBtn.getAttribute('data-slot'));
          return;
        }

        if (e.target.closest('[data-close-modal]') || e.target.id === 'modal-root') {
          closeModal();
          return;
        }

        // Admin Actions
        if (e.target.closest('#btn-reset-demo')) {
          state = getDefaultState();
          saveState();
          render();
          showToast('ডেমো ডেটা সফলভাবে রিসেট করা হয়েছে!');
          return;
        }

        if (e.target.closest('#btn-new-match')) {
          showNewMatchModal();
          return;
        }

        const slotsBtn = e.target.closest('[data-admin-slots]');
        if (slotsBtn) {
          showAdminSlotsModal(Number(slotsBtn.getAttribute('data-admin-slots')));
          return;
        }

        const pointsBtn = e.target.closest('[data-admin-points]');
        if (pointsBtn) {
          showAIPointsModal(Number(pointsBtn.getAttribute('data-admin-points')));
          return;
        }

        const deleteBtn = e.target.closest('[data-admin-delete]');
        if (deleteBtn) {
          const id = Number(deleteBtn.getAttribute('data-admin-delete'));
          if (state.matches.length <= 1) {
            showToast('অন্তত একটি ম্যাচ রাখতে হবে।', 'error');
            return;
          }
          state.matches = state.matches.filter((m) => m.id !== id);
          saveState();
          render();
          showToast('ম্যাচ ডিলিট করা হয়েছে।', 'info');
          return;
        }

        const unpubBtn = e.target.closest('[data-unpublish-room]');
        if (unpubBtn) {
          const id = Number(unpubBtn.getAttribute('data-unpublish-room'));
          const match = state.matches.find((m) => m.id === id);
          if (match) {
            match.roomPublished = false;
            saveState();
            render();
            showAdminSlotsModal(id);
            showToast('রুম আইডি আবার লক করা হয়েছে।', 'info');
          }
          return;
        }

        const remSlotBtn = e.target.closest('[data-remove-slot]');
        if (remSlotBtn) {
          const [mid, snum] = remSlotBtn.getAttribute('data-remove-slot').split(':').map(Number);
          const match = state.matches.find((m) => m.id === mid);
          if (match && match.slots && match.slots[snum]) {
            delete match.slots[snum];
            saveState();
            render();
            showAdminSlotsModal(mid);
            showToast(`Slot #${snum} রিমুভ করা হয়েছে।`, 'info');
          }
          return;
        }

        if (e.target.closest('#btn-instant-points')) {
          const mid = Number(e.target.closest('#btn-instant-points').getAttribute('data-match-id'));
          state.pointsTable = [
            { squad: 'Team Phantom BD', booyah: 1, kills: 14, placePts: 12 },
            { squad: 'Dhaka Reapers', booyah: 0, kills: 11, placePts: 9 },
            { squad: 'Chattogram Esports', booyah: 0, kills: 8, placePts: 8 },
            { squad: 'Sylhet Strikers', booyah: 0, kills: 7, placePts: 7 },
            { squad: 'Apex Predators', booyah: 0, kills: 5, placePts: 6 },
          ];
          saveState();
          showAIPointsModal(mid);
          showToast('AI পয়েন্ট টেবিল জেনারেট সম্পন্ন!');
          return;
        }

        if (e.target.closest('#toggle-bot-autoreply')) {
          state.whatsappBot.autoReply = !state.whatsappBot.autoReply;
          saveState();
          render();
          showToast(`WhatsApp অটো-রিপ্লাই ${state.whatsappBot.autoReply ? 'চালু' : 'বন্ধ'} করা হয়েছে।`);
          return;
        }

        if (e.target.closest('#btn-gen-pairing')) {
          const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
          let code = '';
          for (let i = 0; i < 8; i++) {
            if (i === 4) code += '-';
            code += chars[Math.floor(Math.random() * chars.length)];
          }
          state.whatsappBot.pairingCode = code;
          saveState();
          render();
          showToast('নতুন ডেমো পেয়ারিং কোড তৈরি হয়েছে!');
          return;
        }

        if (e.target.closest('#btn-forgot-pin')) {
          showToast('পিন রিসেট করতে WhatsApp (01791357521)-এ আপনার স্লাগ লিখে মেসেজ দিন।', 'info');
          return;
        }
      });

      // Global Form Submit Delegation
      document.addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;

        if (form.id === 'form-book-slot') {
          const matchId = Number(form.getAttribute('data-match-id'));
          const match = state.matches.find((m) => m.id === matchId);
          if (!match) return;
          const fd = new FormData(form);
          const slotNum = Number(fd.get('slot'));
          match.slots = match.slots || {};
          match.slots[slotNum] = {
            squad: fd.get('squad').trim(),
            igns: [fd.get('ign1'), fd.get('ign2'), fd.get('ign3'), fd.get('ign4')].map((s) => String(s || '').trim()).filter(Boolean),
            whatsapp: fd.get('whatsapp').trim(),
            method: fd.get('method'),
            paid: true,
          };
          saveState();
          closeModal();
          render();
          showToast(`অভিনন্দন! Slot #${slotNum} সফলভাবে বুক হয়েছে। অ্যাডমিন লেজারও আপডেট হয়েছে!`);
          return;
        }

        if (form.id === 'form-publish-room') {
          const matchId = Number(form.getAttribute('data-match-id'));
          const match = state.matches.find((m) => m.id === matchId);
          if (!match) return;
          const fd = new FormData(form);
          const roomId = String(fd.get('roomId') || '').trim();
          const roomPass = String(fd.get('roomPass') || '').trim();
          const broadcast = String(fd.get('broadcast') || '').trim();
          if (!roomId) {
            showToast('পাবলিশ করার আগে একটি Room ID দিন।', 'error');
            return;
          }
          match.roomId = roomId;
          match.roomPass = roomPass;
          match.broadcast = broadcast;
          match.roomPublished = true;
          saveState();
          closeModal();
          render();
          showToast('রুম আইডি ও পাসওয়ার্ড প্লেয়ার পোর্টালে লাইভ করা হয়েছে!');
          return;
        }

        if (form.id === 'form-new-match') {
          const fd = new FormData(form);
          const nextId = state.matches.reduce((max, m) => Math.max(max, m.id), 0) + 1;
          state.matches.unshift({
            id: nextId,
            code: `#${79 + nextId}`,
            title: String(fd.get('title')).trim(),
            map: String(fd.get('map')),
            format: '4v4 SQUAD',
            time: String(fd.get('time')).trim(),
            entryFee: Number(fd.get('entryFee')) || 0,
            prizePool: Number(fd.get('prizePool')) || 0,
            perKill: Number(fd.get('perKill')) || 0,
            status: 'Open',
            roomId: '',
            roomPass: '',
            roomPublished: false,
            broadcast: '',
            slots: {},
          });
          saveState();
          closeModal();
          render();
          showToast('নতুন ম্যাচ তৈরি ও প্লেয়ার পোর্টালে পাবলিশ হয়েছে!');
          return;
        }

        if (form.id === 'form-payments') {
          const fd = new FormData(form);
          state.payments.bkash = String(fd.get('bkash') || '').trim();
          state.payments.nagad = String(fd.get('nagad') || '').trim();
          state.payments.rocket = String(fd.get('rocket') || '').trim();
          saveState();
          showToast('bKash, Nagad ও Rocket নম্বর সেভ করা হয়েছে!');
          return;
        }

        if (form.id === 'form-login') {
          showToast('লগইন সফল হয়েছে! অ্যাডমিন কন্ট্রোল রুমে স্বাগতম।');
          navigate('admin');
          return;
        }

        if (form.id === 'form-signup') {
          const fd = new FormData(form);
          state.organizer = {
            name: String(fd.get('name')).trim(),
            whatsapp: String(fd.get('whatsapp')).trim(),
            guild: String(fd.get('guild')).trim(),
            slug: String(fd.get('slug')).trim().toLowerCase().replace(/[^a-z0-9-]/g, '-') || 'my-esports',
          };
          saveState();
          showToast(`${state.organizer.guild}-এর ৩০ দিনের ফ্রি ট্রায়াল চালু হয়েছে!`);
          navigate('admin');
          return;
        }
      });

      // Live Slug Preview Input Handler
      document.addEventListener('input', (e) => {
        if (e.target.id === 'signup-guild') {
          const slugInput = document.getElementById('signup-slug');
          const preview = document.getElementById('slug-preview');
          const slug = e.target.value.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          if (slugInput && preview) {
            slugInput.value = slug;
            preview.textContent = slug || 'apex-esports';
          }
        } else if (e.target.id === 'signup-slug') {
          const preview = document.getElementById('slug-preview');
          if (preview) {
            preview.textContent = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '-') || 'apex-esports';
          }
        }
      });

      // Route Resolution
      function resolveRouteFromUrl() {
        const hash = (window.location.hash || '').replace('#', '').toLowerCase();
        const path = (window.location.pathname || '').toLowerCase();
        if (hash === 'player' || path.endsWith('/player') || path.endsWith('/player.html')) return 'player';
        if (hash === 'admin' || path.endsWith('/admin') || path.endsWith('/admin.html')) return 'admin';
        if (hash === 'login' || path.endsWith('/login') || path.endsWith('/login.html')) return 'login';
        if (hash === 'signup' || path.endsWith('/signup') || path.endsWith('/signup.html')) return 'signup';
        return 'landing';
      }

      currentRoute = resolveRouteFromUrl();

      window.addEventListener('popstate', () => {
        currentRoute = resolveRouteFromUrl();
        closeModal();
        render();
      });

      // Initial Boot
      render();
    })();
  </script>
</body>
</html>
